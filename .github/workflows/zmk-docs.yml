name: zmk-docs

# Keymap SVG (keymap-drawer) plus the honkit site under zmk/docs, published to the
# gh-pages branch: https://lilfeelz.github.io/keyboard/

on:
  push:
    branches: [main]
    paths:
      - zmk/docs/**
      - zmk/docs/book.json
      - zmk/package.json
      - zmk/keymap_drawer.config.yaml
      - zmk/index.html
      - zmk/config/totem.keymap
      - .github/workflows/zmk-docs.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zmk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: keymap svg
        run: |
          pip install keymap-drawer
          mkdir -p docs/totem/images
          keymap -c keymap_drawer.config.yaml parse -z config/totem.keymap -o /tmp/keymap.yaml
          keymap -c keymap_drawer.config.yaml draw /tmp/keymap.yaml -o docs/totem/images/keymap.svg

      - run: npx --yes honkit build ./docs ./temp

      - run: mv docs/temp site

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./zmk/site
          force_orphan: true
