name: zmk-docs

# Keymap SVG (keymap-drawer) plus the HonKit site under zmk/docs (org theme via docs/dark.css), published to the
# gh-pages branch: https://lilfeelz.github.io/keyboard/

on:
  push:
    branches: [main]
    paths:
      - zmk/docs/**
      - zmk/docs/book.json
      - zmk/package.json
      - zmk/keymap_drawer.config.yaml
      - config/totem.keymap
      - .github/workflows/zmk-docs.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: zmk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: keymap svg
        run: |
          pip install keymap-drawer==0.23.0
          mkdir -p docs/totem/images
          keymap -c keymap_drawer.config.yaml parse -z ../config/totem.keymap -o /tmp/keymap.yaml
          keymap -c keymap_drawer.config.yaml draw /tmp/keymap.yaml -o docs/totem/images/keymap.svg

      - run: npx --yes honkit@6.2.2 build ./docs "$PWD/site" # HonKit resolves a relative output path against the book root

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: zmk/site
          if-no-files-found: error

  # Only this job may push: the installs above pull unpinned transitive dependencies.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site
          path: site
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
