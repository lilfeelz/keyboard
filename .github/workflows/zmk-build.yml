name: zmk-build

# The upstream reusable workflow (zmkfirmware/zmk build-user-config.yml) takes a config_path,
# but expects build.yaml at the repo root and runs west from there. The config sits at the
# root (config/, where the keymap editor looks) while build.yaml, boards and the zephyr
# module stay in zmk/, so this is the same sequence with those paths.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - config/**
      - zmk/boards/**
      - zmk/build.yaml
      - zmk/zephyr/**
      - .github/workflows/zmk-build.yml
  pull_request:
    paths:
      - config/**
      - zmk/boards/**
      - zmk/build.yaml
      - zmk/zephyr/**
      - .github/workflows/zmk-build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.fetch.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: fetch
        run: echo "build_matrix=$(yq -oj -I0 zmk/build.yaml)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    name: build (${{ matrix.shield }})
    env:
      # An isolated workspace, as upstream does when the config repo is also a zephyr
      # module: west clones zmk and zephyr next to the config, and zmk/zephyr/module.yml
      # would collide with the zephyr checkout.
      base: /tmp/zmk-config
      board: ${{ matrix.board }}
      shield: ${{ matrix.shield }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: copy config
        run: |
          mkdir -p "$base"
          cp -R config "$base/config"
          echo "zephyr_version=${ZEPHYR_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            /tmp/zmk-config/modules/
            /tmp/zmk-config/tools/
            /tmp/zmk-config/zephyr/
            /tmp/zmk-config/bootloader/
            /tmp/zmk-config/zmk/
          key: ${{ runner.os }}-build-cache-zephyr-${{ env.zephyr_version }}-modules-${{ hashFiles('config/west.yml', 'zmk/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-zephyr-${{ env.zephyr_version }}-modules-

      - name: west init
        working-directory: ${{ env.base }}
        run: west init -l config

      - name: west update
        working-directory: ${{ env.base }}
        run: west update --fetch-opt=--filter=tree:0

      - name: west zephyr-export
        working-directory: ${{ env.base }}
        run: west zephyr-export

      - name: west build
        working-directory: ${{ env.base }}
        run: |
          west build -s zmk/app -d build -b "$board" -- \
            -DZMK_CONFIG="$base/config" -DSHIELD="$shield" \
            -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE/zmk"

      - name: collect firmware
        shell: bash
        run: |
          mkdir -p artifacts
          name="${shield}-${board//\//_}-zmk"
          echo "artifact_name=$name" >> "$GITHUB_ENV"
          cp "$base/build/zephyr/zmk.uf2" "artifacts/$name.uf2"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.artifact_name }}
          path: artifacts/
