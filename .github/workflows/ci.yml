name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # GitHub-hosted, pinned to what mimi runs (macOS 26, Xcode 26.6). The org's self-hosted
  # runner serves JakobMelchard repos only; hosted macOS minutes are free for public repos.
  ci:
    uses: JakobMelchard/.github/.github/workflows/xcode.yml@main
    with:
      scheme: Totem
      runs-on: macos-26
      xcode-version: "26.6"
      # The scheme only holds the UI tests; the core tests are the TotemKit package. Boot the
      # simulator first: a cold one makes the UI tests time out launching the app.
      test-cmd: >-
        (cd TotemKit && swift test) &&
        xcrun simctl bootstatus 'iPad Air 11-inch (M4)' -b &&
        xcodebuild -project Totem.xcodeproj -scheme Totem
        -destination 'platform=iOS Simulator,name=iPad Air 11-inch (M4)' test
