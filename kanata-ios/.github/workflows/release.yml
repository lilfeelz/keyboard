name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@main
    # App-authored release PRs trigger CI; github.token-created ones do not.
    # Falls back to github.token: the APP_* secrets are JakobMelchard org secrets, absent here.
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
    # A called workflow cannot be granted more than the caller holds; without
    # this the run fails at startup before any step executes.
    permissions:
      contents: write
      pull-requests: write
