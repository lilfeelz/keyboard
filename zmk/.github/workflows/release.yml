name: Release
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    # workflow_run: only after a green build. workflow_dispatch: always (the old
    # gate made manual runs a no-op, the job was skipped every time).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: JakobMelchard/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
      pull-requests: write
    # App-authored release PRs trigger CI; github.token-created ones do not.
    # melchbot (JakobMelchard's app) is installed on lilfeelz; secrets copied from Infisical.
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
